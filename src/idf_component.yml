## ESP-IDF Component Manager manifest for the P4 controller firmware.
## See: https://components.espressif.com
##
## Versions are pinned to compatible ranges as of plan v6 (May 2026).
## Bump deliberately; do not auto-update.

dependencies:
  idf:
    version: ">=5.3"

  ## ---- Waveshare board support package ----
  ## Provides: MIPI-DSI panel init (JD9365 4" 720x720), GT911 touch,
  ## CH422G IO expander (BL/RST/PA-EN), I2C bus init, I2S codec setup,
  ## bsp_display_start_with_config() + bsp_display_brightness_set().
  ## Transitively pulls lvgl, esp_lvgl_port, esp_lcd_touch_gt911,
  ## esp_io_expander_*, esp_codec_dev.
  waveshare/esp32_p4_wifi6_touch_lcd_4b:
    version: "*"
    public: true

  ## ---- LVGL UI stack (pinned here even though BSP also pulls it) ----
  ## 9.3+ required: latest esp_lvgl_port references LV_COLOR_FORMAT_RGB565_SWAPPED
  ## which was added in 9.3.
  lvgl/lvgl:
    version: "~9.3.0"
    public: true

  ## ---- DSP (FFT for WLED Sound Sync) ----
  espressif/esp-dsp: "~1.5.0"

  ## ---- Wi-Fi over the on-board ESP32-C6 via esp_hosted ----
  espressif/esp_wifi_remote: "^1.5.3"
  espressif/esp_hosted: "^2.12.8"

  ## ---- JSON parsing for WLED + OpenWeatherMap ----
  ## (cJSON is built into IDF; no separate dep needed.)
