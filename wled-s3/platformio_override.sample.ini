; Copy this file to the root of an upstream WLED-MM/MoonModules checkout as:
;   platformio_override.ini
;
; Target hardware: Waveshare ESP32-S3-Relay-1CH, default ESP32-S3R8 module,
; 16 MB flash, onboard isolated RS-485, and exposed GPIO1/GPIO2 SH1.0 header.
;
; The parent env name can differ between WLED releases. If your upstream does
; not have env:esp32S3_8MB_PSRAM_M_opi, change the extends line to the nearest
; ESP32-S3 env with 16 MB flash support and 8 MB OPI PSRAM.
;
; LED GPIO/count/type/color order and current limit are normal WLED web settings
; under Settings > LED Preferences. The onboard PSU relay is owned by the 86Box
; RS-485 bridge usermod, not WLED's native relay setting, so it can use longer
; stabilization and anti-chatter timing.

[platformio]
default_envs = S3_WLED_Host

[env:S3_WLED_Host]
extends = env:esp32S3_8MB_PSRAM_M_opi
board = waveshare_esp32s3_relay_1ch
board_build.partitions = ${esp32.extreme_partitions}
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
platform_packages =
    ${env:esp32S3_8MB_PSRAM_M_opi.platform_packages}
    platformio/tool-esptoolpy @ ~1.40501.0

extra_scripts =
    ${scripts_defaults.extra_scripts}
    pre:pio-scripts/86box_esptool_compat.py

build_unflags =
    ${env:esp32S3_8MB_PSRAM_M_opi.build_unflags}
    -D WLED_RELEASE_NAME=esp32S3_8MB_PSRAM_M_opi
    -D LEDPIN=21
    -D BTNPIN=0
    -D RLYPIN=1
    -D SR_DMTYPE=1
    -D I2S_SDPIN=14
    -D I2S_CKPIN=45
    -D I2S_WSPIN=47
    -D MCLK_PIN=46
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D WLED_ENABLE_HUB75MATRIX
    -D NO_GFX
    -D NO_FAST_FUNCTIONS
    -D NO_CIE1931
    -D S3_LCD_DIV_NUM=20
    -D WLEDMM_SLOWPATH

build_flags =
    ${env:esp32S3_8MB_PSRAM_M_opi.build_flags}
    -D WLED_RELEASE_NAME=\"86Box-S3-Waveshare-Relay1CH\"
    -D USERMOD_AUDIOREACTIVE
    -D USERMOD_86BOX_RS485_BRIDGE
    -D USERMOD_86BOX_RS485_UART=1
    -D USERMOD_86BOX_RS485_TX=17
    -D USERMOD_86BOX_RS485_RX=18
    -D USERMOD_86BOX_RS485_DE=21
    -D USERMOD_86BOX_RS485_BAUD=115200
    -D USERMOD_86BOX_PSU_RELAY_PIN=47
    -D USERMOD_86BOX_PSU_RELAY_ENABLED=1
    -D USERMOD_86BOX_PSU_RELAY_ACTIVE_HIGH=1
    -D USERMOD_86BOX_PSU_RELAY_ON_LEAD_MS=750
    -D USERMOD_86BOX_PSU_RELAY_OFF_HOLD_MS=10000
    -D USERMOD_86BOX_PSU_RELAY_MIN_CYCLE_MS=1500
    -D ABL_MILLIAMPS_DEFAULT=5000
    -D LEDPIN=1
    -D BTNPIN=-1
    -D RLYPIN=-1
    -D DEFAULT_LED_COUNT=300
    -D AUDIOPIN=-1
    -D SR_DMTYPE=254
    -D I2S_SDPIN=-1
    -D I2S_CKPIN=-1
    -D I2S_WSPIN=-1
    -D MCLK_PIN=-1
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_ignore =
    ${common_mm.HUB75_lib_ignore}

; Optional first-boot LED defaults only. These can also be changed later on the
; S3 WLED page under Settings > LED Preferences:
;   -D DATA_PINS=1
;   -D PIXEL_COUNTS=300
;   -D PIXEL_TYPE=TYPE_GRB
;
; Leave WLED's native RLYPIN disabled. The 86Box usermod controls GPIO47 as a
; PSU relay and exposes its pin, active level, lead time, hold time, and minimum
; cycle time on the S3 WLED Usermods page.