; PlatformIO Project Configuration File
;
; Waveshare ESP32-P4-WIFI6-Touch-LCD-4B (Smart 86 Box Development Board)
;
; Chip:    ESP32-P4NRW32 (dual-core RISC-V HP @ 400 MHz, single-core LP @ 40 MHz)
; PSRAM:   32 MB in-package (HEX, 200 MHz)
; Flash:   32 MB external NOR (QIO, 80 MHz)
; Wi-Fi/BT: via on-board ESP32-C6-MINI-1U-H8 (SDIO co-processor) -> esp_hosted / esp_wifi_remote
; Display: 4" 720x720 IPS MIPI-DSI w/ capacitive touch
; Audio:   ES8311 codec + ES7210 echo cancellation
; Ethernet: IP101 PHY (100M)
;
; Docs: https://docs.waveshare.com/ESP32-P4-WIFI6-Touch-LCD-4B

[platformio]
default_envs = waveshare_esp32p4_86box

[env:waveshare_esp32p4_86box]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = waveshare_esp32p4_86box
framework = espidf
board_build.partitions = partitions.csv

; Serial / monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize, time
upload_speed = 921600

; Use the on-board USB-to-UART (CP210x / CH343) port (#12).
; Uncomment and set the port if PlatformIO does not auto-detect it.
; upload_port = COM5
; monitor_port = COM5

; Wire ccache into the IDF build for 3–5x faster incremental rebuilds.
extra_scripts = pre:enable_ccache.py

; Flash the ESP32-C6 slave firmware into the slave_fw partition (offset 0x610000).
; Build it with: tools/build_slave_fw.sh
board_upload.flash_extra_images =
    0x610000 tools/slave_build/network_adapter.bin

build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_IDF_TARGET_ESP32P4=1
